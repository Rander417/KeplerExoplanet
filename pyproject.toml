[project]
name = "kepler-exoplanets"
version = "2.0.0.dev0"
description = "Kepler Objects of Interest: cleaning, EDA, ML dispositions, and habitable-zone analysis (2026 refresh of a 2020 bootcamp project)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Richard Anderson" }]

# Phase 2 reproduces the 2020 results, so we stay on pandas 2.x for now
# (pandas 3 changes copy-on-write and string dtypes). Moving to pandas 3 is a
# Phase 3 decision -> see notes/Decisions.
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "mlxtend>=0.23",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "requests>=2.32",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "streamlit>=1.40",
]

# PyTorch (Phase 4 neural-net rebuild) is deliberately NOT listed yet: the
# CUDA wheel index (download.pytorch.org) is unreachable from the Cowork
# sandboxes, so a lock file that includes it cannot be generated or verified
# here. Phase 4 adds an optional extra `nn = ["torch>=2.4"]` with a
# [tool.uv.sources] entry pointing Windows at the cu128 index, and Rich runs
# `uv sync --extra nn` on his machine. See notes/Decisions.

[dependency-groups]
dev = ["ruff>=0.5", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kepler"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["archive", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
